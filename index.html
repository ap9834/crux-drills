<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crux Drills</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Crux Drills">
<style>
/* A black room and a wooden board. Blue is what you can press; green and red only say how it went. */
:root {
  color-scheme: dark;
  --bg: #000;
  --panel: #0b0c0f;
  --line: #23262d;
  --ink: #e9eaee;
  --muted: #8b909b;
  --accent: #4d9fff;
  --good: #3ddc84;
  --bad: #ff5f57;
  --warn: #ffb020;
  --light-sq: #ecd8b4;
  --dark-sq: #b08560;
  --font-display: "Bahnschrift", "DIN Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Cascadia Mono", "Consolas", "SF Mono", ui-monospace, monospace;
  --bs: min(560px, calc(100vw - 24px));
}
@media (min-width: 900px) { :root { --bs: min(clamp(360px, calc(100vh - 150px), 760px), calc(100vw - 460px)); } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-body); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
.brand { font: 700 24px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.brand span { color: var(--accent); }
.counts { display: flex; gap: 16px; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.counts b { font: 600 20px/1 var(--font-display); margin-right: 4px; }
.counts .due b { color: var(--accent); } .counts .new b { color: var(--warn); } .counts .learned b { color: var(--good); }
.top .spacer { flex: 1; }
.savestate { font-size: 13px; color: var(--muted); }
.savestate.ok { color: var(--muted); }
.savestate.warn { color: var(--warn); cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #00142b; font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
.btn.good { border-color: var(--good); color: var(--good); font-weight: 600; }
.btn.bad { border-color: var(--bad); color: var(--bad); font-weight: 600; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.notice { margin: 12px 20px 0; padding: 8px 12px; border: 1px solid var(--line); border-left: 3px solid var(--warn);
          background: var(--panel); border-radius: 6px; font-size: 14px; color: var(--muted); }
.notice b { color: var(--ink); } .notice a { color: var(--accent); }

.main { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; padding: 20px; }
.boardwrap { position: relative; width: var(--bs); flex: none; }
.board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); aspect-ratio: 1; width: 100%;
         border-radius: 3px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.6); user-select: none; touch-action: none; }
.sq { position: relative; min-width: 0; min-height: 0; }
.sq.l { background: var(--light-sq); } .sq.d { background: var(--dark-sq); }
.sq.last.l { background: #d9d38a; } .sq.last.d { background: #b5a453; }
.sq.sel { box-shadow: inset 0 0 0 4px rgba(77,159,255,.9); }
.sq.ok.l { background: #a5dfb3; } .sq.ok.d { background: #62b37c; }
.sq.no.l { background: #f0a59e; } .sq.no.d { background: #cf6c63; }
.sq .dot { position: absolute; left: 36%; top: 36%; width: 28%; height: 28%; border-radius: 50%; background: rgba(0,0,0,.22); pointer-events: none; z-index: 2; }
.sq .ring { position: absolute; inset: 3%; border-radius: 50%; border: 5px solid rgba(0,0,0,.22); pointer-events: none; z-index: 2; }
.coord { position: absolute; font: 600 11px/1 var(--font-body); pointer-events: none; z-index: 2; }
.coord.f { right: 3px; bottom: 2px; } .coord.r { left: 3px; top: 3px; }
.sq.l .coord { color: var(--dark-sq); } .sq.d .coord { color: var(--light-sq); }
.pc { position: absolute; inset: 0; background: center / 100% no-repeat; z-index: 1; }
.board.live .pc.mine { cursor: grab; }
.ghost { position: fixed; pointer-events: none; z-index: 50; transform: translate(-50%, -50%); background: center / 100% no-repeat; }
.pc.lifted { opacity: .25; }
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.arrows .good { fill: rgba(46, 204, 113, .8); } .arrows .bad { fill: rgba(255, 95, 87, .8); }
.promo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); z-index: 20; }
.promo div { display: flex; gap: 6px; background: var(--panel); padding: 10px; border-radius: 8px; border: 1px solid var(--line); }
.promo button { position: relative; width: 64px; height: 64px; border-radius: 6px; border: 1px solid var(--line); background: var(--light-sq); cursor: pointer; }

.side { width: 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.prompt { font: 700 34px/1 var(--font-display); text-transform: uppercase; letter-spacing: .01em; white-space: nowrap; }
.prompt.w::before, .prompt.b::before { content: ""; display: inline-block; width: 18px; height: 18px; border-radius: 50%;
                                       margin-right: 12px; vertical-align: 3px; }
.prompt.w::before { background: #fff; box-shadow: 0 0 0 1px #555; }
.prompt.b::before { background: #111; box-shadow: 0 0 0 1px #777; }
.msg { color: var(--muted); min-height: 1.45em; }
.msg h3 { margin: 0 0 4px; font: 700 24px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; color: var(--ink); }
.msg.good h3 { color: var(--good); } .msg.bad h3 { color: var(--bad); }
.msg p { margin: 0; }
.actions { display: flex; gap: 10px; }
.actions .btn { flex: 1; padding: 11px 14px; }
.lines { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.linehead { display: flex; align-items: center; justify-content: space-between; }
.linehead b { font: 600 12px/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stepper { display: flex; gap: 6px; }
.stepper .btn { padding: 2px 12px; font-size: 18px; line-height: 1.3; }
.lineblock { font-family: var(--font-mono); font-size: 14px; line-height: 1.9; }
.lineblock .tag { font: 600 12px/1 var(--font-body); text-transform: uppercase; letter-spacing: .06em; margin-right: 6px; }
.lineblock .tag.sol { color: var(--good); } .lineblock .tag.tempt { color: var(--bad); }
.lineblock .endmark { font: 600 11px/1 var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
                      border: 1px solid currentColor; border-radius: 4px; padding: 2px 4px; margin-right: 4px; }
.mv { cursor: pointer; padding: 1px 4px; border-radius: 3px; white-space: nowrap; }
.mv:hover { background: #1a2a3d; }
.mv.cur { background: var(--accent); color: #00142b; }
.about { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.about a { color: var(--accent); text-decoration: none; }
.done h2 { margin: 0 0 6px; font: 700 30px/1 var(--font-display); text-transform: uppercase; }
.done p { margin: 0 0 12px; color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
kbd { font: 600 11px/1 var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--ink); }

dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(500px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.7); }
.dlg { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.dlg h2 { margin: 0; font: 700 24px/1 var(--font-display); text-transform: uppercase; }
.dlg p { margin: 0; color: var(--muted); font-size: 14px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); }
.opt label { font-weight: 600; }
.opt small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
.opt input[type=number] { width: 72px; background: #000; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.opt select { background: #000; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.switch { appearance: none; width: 44px; height: 24px; border-radius: 99px; background: #2a2d34; position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #c9ccd3; transition: left .15s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { left: 23px; background: #fff; }
.dlg .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.dlg .row.nowrap { flex-wrap: nowrap; flex: none; gap: 8px; }
.status { font-size: 14px; }
.status.err { color: var(--bad); } .status.ok { color: var(--good); }
dialog.wide { width: min(980px, calc(100vw - 32px)); }
.progbar { display: flex; height: 10px; border-radius: 99px; background: #2a2d34; overflow: hidden; }
.progbar .seg.review { background: var(--good); } .progbar .seg.learning { background: var(--warn); } .progbar .seg.relearn { background: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .tile { width: 12px; height: 12px; display: inline-block; cursor: default; }
.legend .sortby { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; }
.legend select { background: #000; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(16px, 1fr)); gap: 3px; max-height: 46vh; overflow-y: auto; padding: 2px; }
.tile { aspect-ratio: 1; border: 0; border-radius: 3px; background: #2a2d34; padding: 0; cursor: pointer; }
.tile.due { box-shadow: 0 0 0 2px var(--accent); }
.tile.carried { background-image: linear-gradient(135deg, rgba(255,255,255,.35) 0 22%, transparent 22%); }
.tile.suspended { opacity: .35; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.25) 0 2px, transparent 2px 5px); }
.tile.sel { outline: 2px solid #fff; outline-offset: 1px; }
.tile:hover { filter: brightness(1.25); }
.progdetail { min-height: 92px; border-top: 1px solid var(--line); padding-top: 10px; }
.progdetail h3 { margin: 0 0 4px; font: 700 20px/1 var(--font-display); text-transform: uppercase; }
.progdetail p { margin: 0 0 4px; }
.progdetail .row { justify-content: flex-start; margin-top: 8px; }
.hint { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .switch::after { transition: none; } }
@media (max-width: 899px) {
  .main { padding: 12px 12px 24px; gap: 16px; }
  .side { width: var(--bs); }
  .prompt { font-size: 26px; }
  .keys { display: none; }
}
@media (max-width: 640px) {
  .top { padding: 10px 12px; gap: 8px 12px; }
  .brand { font-size: 20px; }
  .counts { order: 3; width: 100%; justify-content: space-between; }
  .savestate { display: none; }
  .top .btn { padding: 6px 10px; font-size: 14px; }
  .dlg .row.nowrap { flex-wrap: wrap; justify-content: flex-start; }
  .opt:has(.nowrap) { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Crux <span>Drills</span></div>
  <div class="counts" aria-label="Today">
    <span class="due" title="Groups to review now"><b id="nDue">0</b>due</span>
    <span class="new" title="New groups you can still start today"><b id="nNew">0</b>new</span>
    <span class="learned" title="Groups you've learned"><b id="nLearned">0</b>learned</span>
  </div>
  <div class="spacer"></div>
  <span class="savestate" id="saveState"></span>
  <button class="btn" id="btnSave" type="button" hidden>Save progress</button>
  <button class="btn" id="btnInstall" type="button" hidden>Install app</button>
  <button class="btn" id="btnProgress" type="button" title="Your progress across all groups (P)">Progress</button>
  <button class="btn" id="btnSettings" type="button">Settings</button>
</header>
<div class="notice" id="notice" hidden></div>
<main class="main">
  <div class="boardwrap">
    <div class="board" id="board" aria-label="Chess board"></div>
    <svg class="arrows" id="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg>
    <div class="promo" id="promo" hidden><div id="promoChoices"></div></div>
  </div>
  <section class="side" aria-live="polite">
    <div class="prompt" id="prompt">Loading…</div>
    <div class="msg" id="msg"></div>
    <div class="actions">
      <button class="btn" id="btnShow" type="button" title="S">Show answer</button>
      <button class="btn primary" id="btnNext" type="button" title="Enter" hidden>Next puzzle</button>
      <button class="btn bad" id="btnMissed" type="button" title="N" hidden>I missed it</button>
      <button class="btn good" id="btnHad" type="button" title="Y" hidden>I had it</button>
    </div>
    <div class="lines" id="lines" hidden></div>
    <div class="done" id="done" hidden>
      <h2>All caught up</h2>
      <p id="doneText"></p>
      <button class="btn" id="btnExtra" type="button">Practise ahead</button>
    </div>
    <div class="foot"><span id="session"></span><span class="keys" id="keys"></span></div>
  </section>
</main>

<dialog id="dlgSettings">
  <form class="dlg" method="dialog">
    <h2>Settings</h2>
    <div class="opt"><label for="optMode">How you solve<small>Flashcards: solve it in your head, show the answer, then say if you had it.</small></label>
      <select id="optMode"><option value="play">Play the moves</option><option value="cards">Flashcards</option></select></div>
    <div class="opt" id="rowAuto"><label for="optAuto">Next puzzle automatically<small>After a solve, the next puzzle starts on its own.</small></label><input class="switch" type="checkbox" id="optAuto"></div>
    <div class="opt"><label for="optNew">New groups per day</label><input type="number" id="optNew" min="0" max="200" step="1"></div>
    <div class="opt"><label for="optRevMax">Reviews per day<small>0 = no limit.</small></label><input type="number" id="optRevMax" min="0" max="9999" step="1"></div>
    <div class="opt"><label for="optLearnN">Solves to learn a new group</label><input type="number" id="optLearnN" min="1" max="6" step="1"></div>
    <div class="opt"><label for="optSpacing">Time between reviews<small>Applies to every group from its next review.</small></label>
      <select id="optSpacing"><option value="60">Shorter</option><option value="100">Normal</option><option value="160">Longer</option></select></div>
    <div class="opt"><label>Your progress<small>Back up, move or start over.</small></label>
      <span class="row nowrap"><button class="btn" type="button" id="btnExport">Export</button><button class="btn" type="button" id="btnImport">Import</button><button class="btn danger" type="button" id="btnResetAll">Reset</button></span></div>
    <input type="file" id="fileImport" accept=".js,.json,text/javascript,application/json" hidden>
    <div class="row"><button class="btn primary" value="ok" type="submit">Done</button></div>
  </form>
</dialog>

<dialog id="dlgProgress" class="wide">
  <div class="dlg">
    <h2>Your progress</h2>
    <p id="progSummary"></p>
    <div class="progbar" id="progBar"></div>
    <div class="legend"><span><i class="tile"></i>New</span><span><i class="tile" style="background:var(--warn)"></i>Learning</span>
      <span><i class="tile" style="background:var(--bad)"></i>Relearning</span>
      <span><i class="tile" style="background:hsl(145,45%,62%)"></i><i class="tile" style="background:hsl(145,70%,32%)"></i>Learned (deeper: longer between reviews)</span>
      <span><i class="tile due"></i>Due now</span>
      <label class="sortby">Order <select id="progSort"><option value="deck">Biggest groups first</option><option value="progress">By progress</option></select></label></div>
    <div class="tiles" id="progTiles"></div>
    <div class="progdetail" id="progDetail"></div>
    <div class="row"><button class="btn" type="button" id="btnProgClose">Close</button></div>
  </div>
</dialog>
<dialog id="dlgSave">
  <div class="dlg">
    <h2>Save your progress</h2>
    <p id="saveText"></p>
    <div class="row" id="saveButtons"></div>
    <div class="status" id="saveStatus"></div>
  </div>
</dialog>

<script src="deck.js"></script>

function slimCrux(c) {
  const t = c.teacher || null;
  const lineOf = facts => ({ u: facts.map(f => f.uci).slice(0, 16), l: facts.map(f => f.label || f.san || f.uci).slice(0, 16) });

  const p = t && t.payoff && Number.isInteger(t.payoff.ply) ? t.payoff.ply : -1;
  const x = t && Number.isInteger(t.until) ? t.until : -1;
  const teacher = t ? lineOf(t.line.slice(0, x > 0 ? Math.max(x, p + 1) : 16)) : { u: [], l: [] };
  teacher.p = p; teacher.x = x;

  teacher.c = t && t.end && t.end.choices ? t.end.choices.map(ch => ch.san) : [];

    id: c.crux_id, pz: c.puzzle, r: c.rating, th: c.themes || [], s: (c.solver || "white")[0],
    fen: c.fen, lm: c.last_move || "", ctx: (c.path && c.path.length ? c.path[c.path.length - 1] : ""),

}

  const byId = new Map();

    if (c.crux_id && c.teacher) byId.set(c.crux_id, c);
  }
  const groups = [], used = new Set();
  for (const g of groupsJson.groups || []) {
    const members = (g.members || []).filter(id => byId.has(id));
    if (members.length < 2) continue;
    const primers = (g.primers || []).filter(id => members.includes(id));
    groups.push({ sig: g.sig || primers[0] || members[0], members, primers: primers.length ? primers : members.slice(0, 2) });

/* ------------------------------------------------------------------ storage */
/*
 * Progress lives in two places:
 *  - this browser (localStorage), saved after every puzzle;
 *  - on a website (GitHub Pages and the like), that's all: the browser keeps it for the site,
 *    and Settings has Export / Import to back it up or move it to another device;
 *  - progress.js in this folder, which the page reads on start with a plain <script> tag.
 *    Opened through the launcher (start_crux_drills.py, "Start Crux Drills"), any browser
 *    autosaves it after every puzzle. Opened as a file, Chrome and Edge can write it directly
 *    once you connect the folder (File System Access); other browsers get a "Save progress"
 *    button that saves progress.js for you to put here.
 * Whichever copy is newer wins when the page opens.
 */
const PAGE_KEY = "cruxdrills:" + decodeURIComponent(location.pathname.replace(/[^/]*$/, ""));

const PROGRESS_FILE = "progress.js";

const idb = {

    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open("cruxdrills", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  async get(k) { const db = await this.open(); return new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); },
  async set(k, v) { const db = await this.open(); return new Promise(res => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); }); }
};

const DEFAULT_SRS = {

  newOrder: "biggest",     // "biggest", "random", "smallest"
  reviewOrder: "due",      // "due", "weakest", "random"
  learnN: 3,               // puzzles to solve to learn a group
  learnStep: 1,            // minutes until the next puzzle of a group you're learning
  learnMiss: 5,            // minutes until a retry after a miss while learning
  graduate: 1,             // days until the first review
  ease: 2.5,               // growth per review for groups started from now on
  mod: 100,                // interval scale, %
  maxIv: 365,              // longest interval, days
  lapseStep: 10,           // minutes until a retry after a missed review
  lapseKeep: 50,           // share of the interval kept after a missed review, %

    srs: { ...DEFAULT_SRS, reviewsPerDay: pick("reviewsPerDay", 0), learnN: pick("learnN", DEFAULT_SRS.learnN), mod: pick("mod", 100) }

const store = {

         + "window.CRUX_PROGRESS = " + JSON.stringify(state) + ";\n";

  async restore() {
    if (location.protocol === "http:" || location.protocol === "https:") {

        if (r.ok && (await r.json()).ok) { this.server = true; return; }
      } catch (e) { /* not the launcher */ }

      return;

      const h = await idb.get(PAGE_KEY + "dir");

      let hasDeck = true;
      try { await h.getFileHandle("deck.js"); } catch (e) { hasDeck = false; }
      if (!hasDeck) throw new Error(`"${h.name}" has no deck.js. Choose the folder this page is in (the one with deck.js).`);

const DAY = 86400000, MIN = 60000;
const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
function freshState() { return { settings: { ...DEFAULT_SETTINGS, srs: { ...DEFAULT_SRS } }, groups: {}, seen: {}, cruxes: {}, suspended: {},
                                  daily: { date: today(), newDone: 0, reviews: 0 } }; }

/*
 * Progress belongs to groups (their schedule), and every puzzle also keeps its own history
 * (cruxes[id]: attempts, solved, last time, and the group it was practised in). When the
 * groups are remade - a puzzle moves to another group, groups merge or split, new groups
 * appear - the schedule follows the puzzles: a group that keeps its name keeps its schedule;
 * a new group made of puzzles you've practised takes over the weakest schedule they had
 * (so nothing you've learned is lost, and nothing is trusted more than before); a new group
 * of puzzles you haven't practised is simply new. Old groups' schedules are kept, unused.
 */
function reconcile() {
  const st = app.state, now = Date.now();
  st.cruxes = st.cruxes || {};
  // History from before puzzles kept their own: what is known of where each was practised.
  for (const [sig, s] of Object.entries(st.groups)) {
    for (const id of [sig, s.lastCrux]) {
      if (id && st.seen[id] && !st.cruxes[id]) st.cruxes[id] = { n: 1, ok: 0, last: st.seen[id], g: sig };
    }
  }
  for (const [id, t] of Object.entries(st.seen)) {
    if (!st.cruxes[id]) {
      const g = app.groupOf.get(id);
      st.cruxes[id] = { n: 1, ok: 0, last: t, g: g && st.groups[g.sig] ? g.sig : null };
    }
  }
  let carried = 0;
  for (const g of app.deck.groups) {
    if (st.groups[g.sig]) continue;
    const played = g.members.map(id => st.cruxes[id]).filter(Boolean);
    if (!played.length) continue;                          // all new to you: a new group
    const from = [...new Set(played.map(r => r.g).filter(sig => sig && sig !== g.sig && st.groups[sig]))]
      .map(sig => st.groups[sig]).filter(s => s.status !== "new");
    const last = Math.max(...played.map(r => r.last || 0));
    let s;
    if (from.length && from.every(x => x.status === "review")) {
      const weakest = from.reduce((a, b) => (a.interval <= b.interval ? a : b));
      s = { status: "review", interval: weakest.interval, due: Math.min(...from.map(x => x.due)) };
    } else if (from.length) {
      const iv = from.filter(x => x.interval > 0).map(x => x.interval);
      s = { status: "relearn", interval: Math.max(1, iv.length ? Math.min(...iv) : 1), due: now };
    } else {
      s = { status: "review", interval: 1, due: now };      // practised, but where isn't known: due now
    }
    st.groups[g.sig] = Object.assign(s, { step: 0, ease: from.length ? from.reduce((a, x) => a + (x.ease || 2.5), 0) / from.length : 2.5,
      reps: 0, lapses: 0, last, carried: true });
    carried++;
  }
  if (carried) store.save(st);
  return carried;
}

/* A stable shuffle (changes daily) for the "random" orders. */
function shuffleKey(sig) { let h = 2166136261; for (const ch of sig + today()) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

const sched = {
  P() { return app.state.settings.srs; },
  daily() { const st = app.state; if (st.daily.date !== today()) st.daily = { date: today(), newDone: 0, reviews: 0 }; return st.daily; },
  gs(sig) { return app.state.groups[sig] || null; },
  active(g) { return !app.state.suspended[g.sig]; },
  /* Groups you're learning or relearning whose next step is due: not limited per day. */
  stepsDue(now) {
    return app.deck.groups.filter(g => { const s = this.gs(g.sig); return s && this.active(g) && (s.status === "learning" || s.status === "relearn") && s.due <= now; })
      .sort((a, b) => this.gs(a.sig).due - this.gs(b.sig).due);
  },
  reviewsDue(now) {
    const list = app.deck.groups.filter(g => { const s = this.gs(g.sig); return s && this.active(g) && s.status === "review" && s.due <= now; });
    const order = this.P().reviewOrder;
    if (order === "random") return list.sort((a, b) => shuffleKey(a.sig) - shuffleKey(b.sig));
    if (order === "weakest") return list.sort((a, b) => this.gs(a.sig).interval - this.gs(b.sig).interval || this.gs(a.sig).due - this.gs(b.sig).due);
    return list.sort((a, b) => this.gs(a.sig).due - this.gs(b.sig).due);
  },
  reviewsLeft() { const m = this.P().reviewsPerDay; return m > 0 ? Math.max(0, m - this.daily().reviews) : Infinity; },
  dueList(now) { return this.stepsDue(now).concat(this.reviewsDue(now).slice(0, this.reviewsLeft())); },
  newList() {
    const list = app.deck.groups.filter(g => !this.gs(g.sig) && this.active(g));
    const order = this.P().newOrder;
    if (order === "random") return list.sort((a, b) => shuffleKey(a.sig) - shuffleKey(b.sig));
    if (order === "smallest") return list.reverse();
    return list;
  },
  counts(now = Date.now()) {
    const d = this.daily();

      learned: app.deck.groups.filter(g => { const s = this.gs(g.sig); return s && s.status === "review"; }).length
    };
  },
  /* The next group to practise and which of its puzzles to show. */
  next(now = Date.now(), ahead = false) {
    const steps = this.stepsDue(now), reviews = this.reviewsDue(now).slice(0, this.reviewsLeft());
    const fresh = this.counts(now).newLeft > 0 ? this.newList() : [];
    const pos = this.P().newPosition, d = this.daily();
    let g = steps[0] || null;
    if (!g && fresh.length && (pos === "before" || (pos === "mixed" && reviews.length && (d.newDone + d.reviews) % 3 === 2))) g = fresh[0];
    if (!g) g = reviews[0] || fresh[0] || null;
    if (!g) {                                       // learn ahead: steps due soon
      g = app.deck.groups.filter(x => { const s = this.gs(x.sig); return s && this.active(x) && (s.status === "learning" || s.status === "relearn") && s.due <= now + this.P().ahead * MIN; })
        .sort((a, b) => this.gs(a.sig).due - this.gs(b.sig).due)[0] || null;
    }
    if (!g && ahead) {
      g = app.deck.groups.filter(x => this.gs(x.sig) && this.active(x) && this.gs(x.sig).status !== "new")
        .sort((a, b) => this.gs(a.sig).due - this.gs(b.sig).due)[0] || null;
    }
    if (!g) return null;
    return { group: g, crux: this.pickCrux(g) };
  },
  pickCrux(g) {
    const s = this.gs(g.sig);

      const step = s ? s.step : 0;                     // new groups start with their primers, in order
      if (step < g.primers.length) return g.primers[step];
    }
    const seen = app.state.seen;
    const last = s && s.lastCrux;
    const pool = g.members.filter(id => id !== last);
    const unseen = pool.filter(id => !seen[id]);
    if (unseen.length) return unseen[0];
    return pool.sort((a, b) => (seen[a] || 0) - (seen[b] || 0))[0] || g.members[0];  // interchangeable: least recently seen
  },
  /* quality: "again" (missed), "hard", "good" or "easy"; true/false mean good/again. */
  grade(g, cruxId, quality, now = Date.now()) {
    if (quality === true) quality = "good";
    if (quality === false) quality = "again";
    const ok = quality !== "again", P = this.P(), st = app.state, d = this.daily();
    let s = st.groups[g.sig];
    if (!s) { s = st.groups[g.sig] = { status: "learning", step: 0, interval: 0, ease: P.ease, due: now, reps: 0, lapses: 0 }; d.newDone++; }
    else if (s.status === "review") d.reviews++;
    st.seen[cruxId] = now;

    h.n++; if (ok) h.ok++; h.last = now; h.g = g.sig; h.lastOk = ok;

      if (!ok) s.due = now + P.learnMiss * MIN;
      else if (quality === "easy") { s.status = "review"; s.interval = cap(Math.max(P.graduate + 1, Math.round(P.graduate * 2 * P.easy))); s.due = now + s.interval * DAY; }
      else if (quality === "hard") s.due = now + P.learnStep * MIN;          // the same step again
      else {
        s.step++;

        else s.due = now + P.learnStep * MIN;
      }
    } else if (s.status === "relearn") {
      if (ok) { s.status = "review"; s.interval = cap(Math.round(s.interval * P.lapseKeep / 100)); s.due = now + s.interval * DAY; }
      else s.due = now + P.lapseStep * MIN;
    } else {

      else {

        else if (quality === "easy") { s.ease = Math.min(4, s.ease + 0.15); ni = Math.max(iv + 2, Math.round(iv * s.ease * P.easy * mod)); }
        else { s.ease = Math.min(4, s.ease + 0.05); ni = iv < 1 ? 1 : Math.max(iv + 1, Math.round(iv * s.ease * mod)); }

let drag = null;

  s.mode = $("optMode").value; s.auto = $("optAuto").checked;
  s.newPerDay = num("optNew", 0, 200, s.newPerDay);
  s.srs.reviewsPerDay = num("optRevMax", 0, 9999, s.srs.reviewsPerDay);
  s.srs.learnN = num("optLearnN", 1, 6, s.srs.learnN);
  if ($("optSpacing").value !== closestSpacing(s.srs.mod)) s.srs.mod = +$("optSpacing").value;
  if (JSON.stringify(s) === before) return;
  store.save(app.state);
  updateCounts();
  if (!app.cur) nextPuzzle();
  else if (modeChanged && !app.cur.finished) startPuzzle(app.cur.group, app.cur.c);
  else if (modeChanged) nextPuzzle();
});

$("btnSave").addEventListener("click", openSaveDialog);
$("saveState").addEventListener("click", () => { if (!store.dir && !(store.server && !store.serverDown)) openSaveDialog(); });

/* ------------------------------------------------------------------ export / import */
function exportProgress() {
  store.download(`crux-drills-progress-${today()}.js`);
}
function parseProgress(text) {
  const at = text.indexOf("window.CRUX_PROGRESS =");
  const json = (at >= 0 ? text.slice(at + "window.CRUX_PROGRESS =".length) : text).trim().replace(/;\s*$/, "");
  let st = null;
  try { st = JSON.parse(json); } catch (e) { /* checked below */ }
  if (!st || typeof st !== "object" || typeof st.groups !== "object") throw new Error("That file isn't Crux Drills progress.");
  return st;
}
async function importProgress(file) {
  let st;
  try { st = parseProgress(await file.text()); }
  catch (e) { showNotice(`<b>Couldn't import ${escapeHtml(file.name)}:</b> ${escapeHtml(e.message || String(e))}`); return; }
  const known = Object.keys(st.groups).filter(sig => app.deck.groups.some(g => g.sig === sig)).length;
  const msg = `Replace your progress here with ${file.name}? It has ${Object.keys(st.groups).length} groups started`
            + (known < Object.keys(st.groups).length ? ` (${known} of them in this puzzle set)` : "") + ".";
  if (!confirm(msg)) return;
  app.importing = true;
  dlgS.close();
  app.state = normalizeSettings(Object.assign(freshState(), st));
  app.state.saved = Date.now();
  lsSet(PAGE_KEY + "state", app.state);
  if (store.server) await store.writeServer();
  else if (store.dir) await store.writeFile();
  location.reload();
}
$("btnExport").addEventListener("click", exportProgress);
$("btnImport").addEventListener("click", () => $("fileImport").click());
$("fileImport").addEventListener("change", ev => { const f = ev.target.files[0]; ev.target.value = ""; if (f) importProgress(f); });

/* ------------------------------------------------------------------ install as an app */
/*
 * On the website (publish_site.py adds a manifest and sw.js), the page can be installed as an
 * app: an icon, its own window, and it opens offline. In Chrome / Edge / Android an
 * "Install app" button appears; on iPhone / iPad there's no button, so a note explains
 * Add to Home Screen, which also stops Safari clearing the progress after a week away.
 */
const pwa = {
  prompt: null,
  available() { return store.hosted && !!document.querySelector('link[rel="manifest"]'); },
  standalone() { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; },
  ios() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); },
  start() {
    if (!this.available()) return;
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { /* still works online */ });
    if (this.standalone()) return;
    if (this.prompt) $("btnInstall").hidden = false;   // offered before the page knew it's on the website
    if (this.ios() && !lsGet(PAGE_KEY + "iosNoteDone")) {
      const started = Object.keys(app.state.groups).length > 0;
      showNotice("<b>Add Crux Drills to your Home Screen:</b> tap Share, then <b>Add to Home Screen</b>. It opens like an app, and Safari won't clear your progress if you're away for a week."
        + (started ? " The Home Screen app starts with its own empty progress: in Settings, <b>Export</b> here and <b>Import</b> there." : "")
        + ' <a href="#" id="lnkIosDone">Don\'t show this again</a>');
      $("lnkIosDone").addEventListener("click", ev => { ev.preventDefault(); lsSet(PAGE_KEY + "iosNoteDone", true); showNotice(""); });
    }
  }
};
window.addEventListener("beforeinstallprompt", ev => {
  ev.preventDefault();
  pwa.prompt = ev;
  if (pwa.available()) $("btnInstall").hidden = false;
});
window.addEventListener("appinstalled", () => { pwa.prompt = null; $("btnInstall").hidden = true; });
$("btnInstall").addEventListener("click", async () => {
  if (!pwa.prompt) return;
  pwa.prompt.prompt();
  try { await pwa.prompt.userChoice; } catch (e) { /* dismissed */ }
  pwa.prompt = null; $("btnInstall").hidden = true;
});

/* ------------------------------------------------------------------ progress map */
/*
 * Every group as a tile: grey = new, amber = learning its primers, red = relearning after a
 * miss, green = learned (the longer until its next review, the deeper the green). A blue
 * ring marks groups due now. Groups are interchangeable sets of puzzles, so this is your
 * progress across every kind of difficulty in the deck. Click a tile for its details.
 */
function groupStats(g) {
  const s = sched.gs(g.sig), now = Date.now();
  let n = 0, ok = 0, seenPuzzles = 0;
  for (const id of g.members) { const h = app.state.cruxes[id]; if (h) { n += h.n; ok += h.ok; seenPuzzles++; } }
  const status = !s ? "new" : s.status;
  const due = !!s && status !== "new" && s.due <= now && !app.state.suspended[g.sig];
  return { s, status, due, n, ok, seenPuzzles };
}
function tileColor(st) {
  if (st.status === "new") return "";
  if (st.status === "learning") return "var(--warn)";
  if (st.status === "relearn") return "var(--bad)";
  const days = Math.max(1, st.s.interval || 1);
  const k = Math.min(1, Math.log(days) / Math.log(60));     // 1 day .. 2 months
  return `hsl(145, ${45 + 25 * k}%, ${62 - 30 * k}%)`;
}
function renderProgress() {
  const groups = app.deck.groups, sort = $("progSort").value;
  const stats = new Map(groups.map(g => [g, groupStats(g)]));
  const rank = { relearn: 0, learning: 1, review: 2, new: 3 };
  const order = groups.slice();
  if (sort === "progress") order.sort((a, b) => {
    const x = stats.get(a), y = stats.get(b);
    return rank[x.status] - rank[y.status] || ((y.s && y.s.interval) || 0) - ((x.s && x.s.interval) || 0) || a.num - b.num;
  });
  const c = { new: 0, learning: 0, relearn: 0, review: 0 };
  let due = 0;
  for (const st of stats.values()) { c[st.status]++; if (st.due) due++; }
  const total = groups.length || 1, pct = x => (100 * x / total).toFixed(2) + "%";
  $("progSummary").innerHTML = `<b>${c.review}</b> of ${groups.length} groups learned (${Math.round(100 * c.review / total)}%) · `
    + `${c.learning + c.relearn} in progress · ${c.new} new · ${due} due now`;
  $("progBar").innerHTML = `<span class="seg review" style="width:${pct(c.review)}"></span>`
    + `<span class="seg learning" style="width:${pct(c.learning)}"></span><span class="seg relearn" style="width:${pct(c.relearn)}"></span>`;
  const tiles = $("progTiles");
  tiles.innerHTML = "";
  for (const g of order) {
    const st = stats.get(g), t = document.createElement("button");
    t.type = "button";
    t.className = "tile " + st.status + (st.due ? " due" : "") + (st.s && st.s.carried && !st.s.reps && !st.s.lapses ? " carried" : "")
      + (app.state.suspended[g.sig] ? " suspended" : "");
    t.style.background = tileColor(st);
    t.title = `Group ${g.num + 1}: ${g.members.length} puzzles, ${st.status === "review" ? "learned" : st.status}`;
    t.dataset.num = g.num;
    t.addEventListener("click", () => showGroupDetail(g));
    tiles.appendChild(t);
  }
  if (!app.progSel || !groups.includes(app.progSel)) $("progDetail").innerHTML = `<p class="hint">Click a tile to see that group.</p>`;
  else showGroupDetail(app.progSel);
}
function showGroupDetail(g) {
  app.progSel = g;
  document.querySelectorAll("#progTiles .tile").forEach(t => t.classList.toggle("sel", +t.dataset.num === g.num));
  const st = groupStats(g), s = st.s;
  const state = { new: "New: starts with its primers", learning: `Learning (${s ? s.step : 0} of ${Math.max(1, Math.min(sched.P().learnN, g.members.length))} solved)`,
                  relearn: "Relearning after a miss", review: `Learned: reviewed every ${s ? s.interval : 1} day${s && s.interval === 1 ? "" : "s"}` }[st.status];
  const parts = [`<h3>Group ${g.num + 1}</h3>`, `<p>${state}${s && st.status !== "new" ? ` · next ${whenText(s.due)}` : ""}</p>`,
    `<p>${g.members.length} puzzles, ${st.seenPuzzles} of them seen · ${st.n ? `solved ${st.ok} of ${st.n} tries` : "not tried yet"}</p>`];
  if (s && s.carried) parts.push(`<p class="hint">Its puzzles were in other groups before: their progress carried over.</p>`);
  const susp = !!app.state.suspended[g.sig];
  if (susp) parts.push(`<p class="hint">Suspended: it doesn't come up in practice.</p>`);
  parts.push(`<div class="row"><button class="btn primary" type="button" id="btnPractiseGroup">Practise this group now</button>`
    + `<button class="btn" type="button" id="btnSuspend" title="Leave this group out of practice, or bring it back">${susp ? "Unsuspend" : "Suspend"}</button>`
    + `<button class="btn danger" type="button" id="btnResetGroup" title="Forget your progress on this group: it starts again as new">Reset</button></div>`);
  $("progDetail").innerHTML = parts.join("");
  $("btnSuspend").addEventListener("click", () => {
    if (susp) delete app.state.suspended[g.sig]; else app.state.suspended[g.sig] = true;
    store.save(app.state); updateCounts(); renderProgress();
  });
  $("btnResetGroup").addEventListener("click", () => {
    if (!confirm(`Forget your progress on group ${g.num + 1}? It starts again as a new group.`)) return;
    delete app.state.groups[g.sig];
    for (const id of g.members) { delete app.state.cruxes[id]; delete app.state.seen[id]; }
    store.save(app.state); updateCounts(); renderProgress();
  });
  $("btnPractiseGroup").addEventListener("click", () => {
    $("dlgProgress").close();
    startPuzzle(g, app.byId.get(sched.pickCrux(g)));
  });
}
function openProgress(group) {
  if (group) app.progSel = group;
  renderProgress();
  if (!$("dlgProgress").open) $("dlgProgress").showModal();
  if (group) { const t = document.querySelector(`#progTiles .tile[data-num="${group.num}"]`); if (t) t.scrollIntoView({ block: "nearest" }); }
}
$("btnProgress").addEventListener("click", () => openProgress());
$("progSort").addEventListener("change", renderProgress);
$("btnProgClose").addEventListener("click", () => $("dlgProgress").close());

/* ------------------------------------------------------------------ start */
function newer(a, b) { if (!a) return b; if (!b) return a; return (a.saved || 0) >= (b.saved || 0) ? a : b; }
async function start() {
  ui.build();
  const deck = window.CRUX_DECK && window.CRUX_DECK.groups ? window.CRUX_DECK : null;
  setDeck(deck || SAMPLE_DECK);
  const st = newer(lsGet(PAGE_KEY + "state"), window.CRUX_PROGRESS || null);
  app.state = normalizeSettings(st ? Object.assign(freshState(), st) : freshState());
  if (!deck) showNotice("<b>No deck.js next to this page</b>, so these are 8 example puzzles. Run <b>make_practice.py</b> to put your groups in this folder, then reload.");
  await store.restore();
  reconcile();
  if (store.server) { app.state.saved = app.state.saved || Date.now(); store.writeServer(); }
  else if (deck && location.protocol === "file:" && store.canWrite && !store.dir && !store.needsPermission) {
    // Chrome / Edge opened as a file, not saving to the folder yet: offer it up front.
    showNotice('<b>Turn on autosave:</b> click <a href="#" id="lnkAutosave">Save to folder</a> and choose this page\'s folder (the one with deck.js). '
             + "Your progress is then written to progress.js there after every puzzle. Until then it's kept in this browser only.");
    $("lnkAutosave").addEventListener("click", ev => { ev.preventDefault(); openSaveDialog(); });
  }
  renderSaveState();
  pwa.start();
  nextPuzzle();
}
start();
</script>
